<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The 28-Day Stick Challenge · Build Your Plan</title>
<meta name="description" content="A gentle 15-minute stick routine for women over 40. Take the 2-minute quiz and build your personal 28-day plan.">
<meta property="og:title" content="The 28-Day Stick Challenge">
<meta property="og:description" content="15 minutes a day. One broom handle. Built for women 40+.">
<meta name="theme-color" content="#FFF4F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23F27BA4'/><line x1='18' y1='70' x2='82' y2='30' stroke='%23fff' stroke-width='10' stroke-linecap='round'/></svg>">
<style>
:root{
  --bg:#FFF4F7; --card:#FFFFFF; --soft:#FFE4EC; --soft2:#FFD3E0;
  --pink:#F27BA4; --pink-d:#E0558A; --ink:#3B2531; --muted:#8C6E7C;
  --line:#F6D5E0; --ok:#33B08A; --gold:#F4B740; --wood:#C08A5B;
  --r:18px; --shadow:0 6px 20px rgba(224,85,138,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-weight:600}
body{min-height:100dvh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative;padding-bottom:96px}

/* Header */
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 16px 8px}
.hdr-top{display:flex;align-items:center;gap:10px}
.back{width:36px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:18px;color:var(--pink-d);flex:none}
.back[hidden]{visibility:hidden;display:grid}
.brand{flex:1;text-align:center;font-weight:900;letter-spacing:.06em;font-size:13px;color:var(--pink-d);text-transform:uppercase}
.score-mini{width:44px;height:44px;flex:none;position:relative}
.score-mini svg{transform:rotate(-90deg)}
.score-mini b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--pink-d)}
.phases{display:flex;gap:6px;margin-top:10px}
.ph{flex:1}
.ph-bar{height:6px;border-radius:6px;background:var(--soft);overflow:hidden}
.ph-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--pink-d));border-radius:6px;transition:width .4s}
.ph-lbl{font-size:10px;text-align:center;margin-top:4px;color:var(--muted);font-weight:800;white-space:nowrap}
.ph.on .ph-lbl{color:var(--pink-d)}

/* Plan card */
.plan{margin:6px 16px 4px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
.plan-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:900;color:var(--ink)}
.plan-h span{color:var(--pink-d)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.chip{height:30px;border-radius:10px;background:#F7EEF2;border:1.5px dashed #EBCFDA;font-size:10.5px;display:flex;align-items:center;justify-content:center;padding:0 4px;text-align:center;line-height:1.05;color:#C9AAB8;font-weight:800;overflow:hidden}
.chip.on{background:var(--soft);border:1.5px solid var(--soft2);color:var(--ink);animation:pop .45s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

/* Screen */
main{flex:1;padding:8px 16px 16px}
.scr{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:26px;line-height:1.15;margin:8px 0 8px;font-weight:900;letter-spacing:-.01em}
h2{font-size:23px;line-height:1.2;margin:10px 0 6px;font-weight:900}
.sub{color:var(--muted);font-size:15px;margin:0 0 14px;line-height:1.4}
.hl{color:var(--pink-d)}
p{line-height:1.5}

.opts{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:15px 16px;font-size:16px;font-weight:800;transition:transform .12s,border-color .2s,background .2s;box-shadow:0 2px 0 rgba(224,85,138,.06)}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:var(--pink);background:#FFF0F5}
.opt .ic{font-size:20px;width:26px;text-align:center;flex:none}
.opt .ck{margin-left:auto;width:22px;height:22px;border-radius:7px;border:2px solid var(--soft2);flex:none;display:grid;place-items:center;font-size:13px;color:#fff}
.opt.sel .ck{background:var(--pink);border-color:var(--pink)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.card-img{background:var(--card);border:2px solid var(--line);border-radius:var(--r);overflow:hidden;padding:0;display:flex;flex-direction:column;align-items:stretch;transition:transform .12s,border-color .2s}
.card-img:active{transform:scale(.97)}
.card-img.sel{border-color:var(--pink)}
.card-img .art{background:linear-gradient(180deg,#FFE9F0,#FFF7FA);height:150px;display:flex;align-items:flex-end;justify-content:center}
.card-img .art svg{height:148px}
.card-img .lbl{padding:11px 10px;font-weight:900;font-size:15px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,var(--pink),var(--pink-d));color:#fff}
.card-img.light .lbl{background:#fff;color:var(--ink)}
.card-img.light.sel .lbl{background:var(--pink);color:#fff}

/* Cover */
.cover h1{text-align:center;font-size:28px;margin-top:4px}
.cover .sub{text-align:center}
.badges{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.badge{font-size:12px;font-weight:800;background:var(--soft);color:var(--pink-d);padding:6px 10px;border-radius:99px}
.foot-note{text-align:center;font-size:12px;color:var(--muted);margin-top:16px}

/* CTA */
.cta-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(255,244,247,0),var(--bg) 35%)}
.cta-bar .in{max-width:448px;margin:0 auto}
.cta{width:100%;padding:17px;border-radius:16px;background:linear-gradient(90deg,var(--pink),var(--pink-d));color:#fff;font-size:17px;font-weight:900;letter-spacing:.01em;box-shadow:0 8px 20px rgba(224,85,138,.35);transition:opacity .2s,transform .1s}
.cta:active{transform:scale(.98)}
.cta:disabled{opacity:.45;box-shadow:none}
.cta.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 8px 20px rgba(224,85,138,.35)}50%{box-shadow:0 8px 32px rgba(224,85,138,.6)}}

/* Info / persuasion */
.info-art{background:linear-gradient(180deg,#FFE3EC,#FFF4F7);border-radius:24px;display:flex;justify-content:center;padding:14px 0 0;margin:6px 0 16px}
.info-art svg{height:190px}
.info p{font-size:17px}
.tip{background:var(--card);border-left:5px solid var(--pink);border-radius:14px;padding:14px 16px;margin-top:12px;font-size:15px;box-shadow:var(--shadow)}

/* Toast reaction */
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);opacity:0;z-index:50;background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-weight:800;font-size:15px;max-width:88%;text-align:center;transition:all .3s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Slider */
.slider-wrap{background:var(--card);border-radius:22px;padding:22px 18px;border:2px solid var(--line);margin-top:10px;text-align:center}
.slider-emoji{font-size:56px;line-height:1;transition:transform .2s}
.slider-val{font-size:34px;font-weight:900;color:var(--pink-d);margin:6px 0 2px}
.slider-cap{color:var(--muted);font-size:14px;min-height:20px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:10px;background:var(--soft);margin:20px 0 8px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:#fff;border:4px solid var(--pink);box-shadow:0 3px 10px rgba(224,85,138,.4)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid var(--pink)}
.range-lbls{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:800}

/* Statements / swipe */
.stack{position:relative;height:360px;margin-top:10px}
.sw{position:absolute;inset:0;background:var(--card);border-radius:24px;border:2px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;touch-action:pan-y;user-select:none;transition:transform .35s,opacity .35s}
.sw .art{height:180px;display:flex;align-items:flex-end}
.sw .art svg{height:180px}
.sw .t{font-size:20px;font-weight:900;margin-top:10px;line-height:1.25}
.sw .s{font-size:13px;color:var(--muted);margin-top:4px}
.sw .stamp{position:absolute;top:18px;padding:6px 12px;border-radius:10px;font-weight:900;font-size:18px;border:3px solid;opacity:0;transform:rotate(-10deg)}
.sw .stamp.y{left:18px;color:var(--ok);border-color:var(--ok)}
.sw .stamp.n{right:18px;color:#D9534F;border-color:#D9534F;transform:rotate(10deg)}
.sw-btns{display:flex;justify-content:center;gap:26px;margin-top:16px}
.sw-btn{width:66px;height:66px;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:28px;display:grid;place-items:center;border:2px solid var(--line)}
.sw-btn.y{color:var(--pink-d)}
.sw-count{text-align:center;color:var(--muted);font-size:13px;font-weight:800;margin-top:6px}
.sw-btn-lbl{display:flex;justify-content:center;gap:40px;font-size:12px;color:var(--muted);font-weight:800;margin-top:6px}

/* Body map */
.bodymap{position:relative;width:260px;margin:4px auto 0}
.bodymap svg{width:100%;display:block}
.zone{position:absolute;border-radius:50%;border:2.5px dashed var(--pink);background:rgba(242,123,164,.12);display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--pink-d);animation:breathe 2s infinite}
.hlpulse{animation:hlp 1.1s ease-in-out infinite}@keyframes hlp{0%,100%{opacity:.75}50%{opacity:1}}
.zone.sel{background:rgba(255,92,147,.12);color:#fff;text-shadow:0 1px 3px rgba(120,20,60,.6);border-style:solid;animation:none}
.zone.off{opacity:0;transition:opacity .3s}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* Level up */
.lvl{text-align:center;padding-top:10px}
.lvl .medal{width:120px;height:120px;margin:10px auto 6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE9A8,var(--gold));display:grid;place-items:center;font-size:56px;box-shadow:0 0 0 10px #FFF0C9,0 14px 30px rgba(244,183,64,.4);animation:medal .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes medal{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.lvl .kicker{font-size:13px;font-weight:900;letter-spacing:.08em;color:var(--pink-d);text-transform:uppercase;margin-top:14px}
.big-score{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px auto 6px;background:var(--card);border-radius:20px;padding:14px 18px;box-shadow:var(--shadow);width:max-content}
.big-score .n{font-size:40px;font-weight:900;color:var(--pink-d)}
.big-score .l{text-align:left;font-size:13px;color:var(--muted);line-height:1.3}
.progress-note{margin-top:10px;font-weight:800}

/* Confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}

/* Challenge */
.timer{width:210px;height:210px;margin:6px auto;position:relative}
.timer svg.ring{transform:rotate(-90deg);position:absolute;inset:0}
.timer .fig{position:absolute;inset:22px;display:flex;align-items:flex-end;justify-content:center;border-radius:50%;background:#FFF0F5;overflow:hidden}
.timer .fig svg{height:150px}
.timer .num{position:absolute;right:-6px;top:-6px;background:var(--pink);color:#fff;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:900;box-shadow:var(--shadow)}

/* Loading checklist */
.load-ring{width:150px;height:150px;margin:16px auto;position:relative}
.load-ring svg{transform:rotate(-90deg)}
.load-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:32px;font-weight:900;color:var(--pink-d)}
.checks{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:10px}
.checks li{display:flex;align-items:center;gap:10px;font-weight:800;color:#C9AAB8;transition:color .3s}
.checks li .d{width:24px;height:24px;border-radius:50%;border:2px solid var(--soft2);display:grid;place-items:center;font-size:13px;color:#fff;flex:none;transition:all .3s}
.checks li.done{color:var(--ink)}
.checks li.done .d{background:var(--ok);border-color:var(--ok)}
.rot{margin-top:18px;background:var(--card);border-radius:16px;padding:14px 16px;font-size:14px;color:var(--muted);min-height:66px;box-shadow:var(--shadow);transition:opacity .3s}

/* Diagnosis */
.bars{display:flex;flex-direction:column;gap:12px;margin:14px 0}
.bar-row .top{display:flex;justify-content:space-between;font-weight:900;font-size:15px}
.bar-row .track{height:12px;border-radius:12px;background:var(--soft);margin-top:6px;overflow:hidden}
.bar-row .track i{display:block;height:100%;width:0;border-radius:12px;background:linear-gradient(90deg,var(--pink),var(--pink-d));transition:width 1.1s ease}
.bar-row:first-child .track i{background:linear-gradient(90deg,#F59E6B,#E0558A)}
.explain{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);font-size:15px;line-height:1.5}
.explain b{color:var(--pink-d)}

/* Inputs */
.field{width:100%;padding:17px 16px;border-radius:16px;border:2px solid var(--line);font:inherit;font-size:18px;font-weight:800;background:#fff;color:var(--ink);outline:none}
.field:focus{border-color:var(--pink)}
.gift{background:linear-gradient(135deg,#FFE4EC,#FFF4F7);border:2px dashed var(--pink);border-radius:20px;padding:16px;display:flex;gap:12px;align-items:center;margin:10px 0 16px}
.gift .g{font-size:42px}
.small{font-size:12px;color:var(--muted);line-height:1.45;margin-top:12px}
.err{color:#D9534F;font-size:13px;font-weight:800;min-height:18px;margin-top:6px}

/* Score reveal */
.score-big{width:220px;height:220px;margin:8px auto;position:relative}
.score-big svg{transform:rotate(-90deg)}
.score-big .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-big .c b{font-size:58px;font-weight:900;color:var(--pink-d);line-height:1}
.score-big .c span{font-size:13px;color:var(--muted);font-weight:800}
.fit-tag{display:inline-block;background:var(--ok);color:#fff;font-weight:900;padding:6px 14px;border-radius:99px;font-size:14px}
.breakdown{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.breakdown div{background:var(--card);border-radius:14px;padding:12px;font-weight:800;font-size:14px;box-shadow:var(--shadow)}

/* Future self */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.compare .col{background:var(--card);border-radius:20px;padding:12px;box-shadow:var(--shadow);text-align:center}
.compare .col .art{height:170px;display:flex;align-items:flex-end;justify-content:center;background:#FFF0F5;border-radius:14px}
.compare .col .art svg{height:160px}
.compare .col h4{margin:10px 0 6px;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.meter{display:flex;gap:3px;margin:4px 0 8px}
.meter i{flex:1;height:7px;border-radius:4px;background:var(--soft)}
.meter i.on{background:var(--pink)}
.mlbl{font-size:12px;text-align:left;color:var(--muted);font-weight:800}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.cal div{aspect-ratio:1;border-radius:10px;background:var(--card);display:grid;place-items:center;font-weight:900;font-size:13px;color:#C9AAB8;border:1.5px solid var(--line)}
.cal div.d1{background:var(--pink);color:#fff;border-color:var(--pink);animation:glow 1.5s infinite;cursor:pointer}
.cal div.wk{color:var(--muted)}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(242,123,164,.6)}50%{box-shadow:0 0 0 8px rgba(242,123,164,0)}}
.week-lbl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;font-size:11px;font-weight:900;text-align:center;color:var(--pink-d)}
.modal{position:fixed;inset:0;background:rgba(59,37,49,.45);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:480px;animation:up .3s}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.moves-list{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.moves-list div{display:flex;align-items:center;gap:10px;background:#FFF0F5;border-radius:12px;padding:10px 12px;font-weight:800}

/* Scratch */
.scratch{position:relative;width:300px;height:190px;margin:14px auto;border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.scratch .prize{position:absolute;inset:0;background:linear-gradient(135deg,#FFF,#FFE4EC);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px}
.scratch .prize b{font-size:22px;color:var(--pink-d);line-height:1.2}
.scratch .prize span{font-size:13px;color:var(--muted);margin-top:6px;font-weight:800}
.scratch canvas{position:absolute;inset:0;touch-action:none;cursor:pointer}

/* Offer */
.offer h1{font-size:25px}
.box{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin:14px 0}
.price-box{border:2.5px solid var(--pink);position:relative;padding-top:24px}
.price-box .ribbon{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--pink);color:#fff;font-size:12px;font-weight:900;padding:5px 12px;border-radius:99px;white-space:nowrap}
.price-row{display:flex;justify-content:space-between;align-items:center}
.price-row .nm{font-weight:900;font-size:17px}
.price-row .nm small{display:block;color:var(--muted);font-size:12px;font-weight:800;margin-top:2px}
.price{font-size:38px;font-weight:900;color:var(--pink-d);line-height:1}
.per-day{font-size:12px;color:var(--muted);text-align:right;font-weight:800}
.incl{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
.incl li{display:flex;gap:8px;font-size:15px;font-weight:700}
.incl li:before{content:"✓";color:var(--ok);font-weight:900}
.incl li.bonus{background:#FFF0F5;border-radius:10px;padding:8px 10px;font-weight:900}
.incl li.bonus:before{content:"🎁"}
.guar{display:flex;gap:12px;align-items:flex-start}
.guar .seal{flex:none;width:62px;height:62px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:900;font-size:12px;text-align:center;line-height:1.05}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px}
.vs .c{border-radius:16px;padding:12px}
.vs .bad{background:#F5EEF1;color:var(--muted)}
.vs .good{background:var(--soft);font-weight:800}
.vs ul{margin:6px 0 0;padding-left:16px}
.vs li{margin:5px 0}
.faq details{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:8px;box-shadow:0 2px 8px rgba(224,85,138,.06)}
.faq summary{font-weight:900;cursor:pointer;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"+";float:right;color:var(--pink-d)}
.faq details[open] summary:after{content:"–"}
.faq p{margin:8px 0 0;color:var(--muted);font-size:14px}
.disc{font-size:11px;color:var(--muted);text-align:center;line-height:1.5;margin:18px 4px 0}
.plan-full .chips{grid-template-columns:repeat(2,1fr)}
.plan-full .chip{height:36px;font-size:13px}

/* Stick animation frames */
.anim .fa,.anim .fb{transform-box:fill-box}
.anim .fb{opacity:0}
.anim.go .fa{animation:fa 1.6s infinite steps(1)}
.anim.go .fb{animation:fb 1.6s infinite steps(1)}

</div>

<script>
/* ================= CONFIG ================= */
const CONFIG = {
  CHECKOUT_URL: "https://checkout.example.com/stick-challenge", // TODO: link do checkout ($19)
  LEAD_WEBHOOK: "",          // TODO opcional: URL que recebe {email,name,...} por POST (Zapier/Make/ActiveCampaign)
  PRICE: 19,
  META_PIXEL_ID: ""          // TODO: ID do pixel da Meta
};

/* ================= TRACKING ================= */
if (CONFIG.META_PIXEL_ID) {
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', CONFIG.META_PIXEL_ID); fbq('track','PageView');
}
function track(ev, params={}){
  const p = Object.assign({phase:A.hormone||'', joint:(A.joints||[])[0]||'', score:score}, params);
  try{ if(window.fbq){ ['Lead','InitiateCheckout','ViewContent'].includes(ev) ? fbq('track',ev,p) : fbq('trackCustom',ev,p);} }catch(e){}
  try{ (window.dataLayer=window.dataLayer||[]).push(Object.assign({event:ev},p)); }catch(e){}
}
const UTM = Object.fromEntries(new URLSearchParams(location.search));

/* ================= ILLUSTRATIONS (SVG) ================= */
const SKIN = ['#F3C9AE','#E8B08C','#C68863','#8D5B3F'];
const f1 = n => (+n).toFixed(1);
function shade(hex,amt){ let c=hex.replace('#',''); const n=parseInt(c,16); const ch=[(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.max(0,Math.min(255,Math.round(v*(1+amt))))); return '#'+ch.map(v=>v.toString(16).padStart(2,'0')).join(''); }
function seg(a,b,r1,r2,c){ const [x1,y1]=a,[x2,y2]=b,dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
  return `<g fill="${c}"><path d="M${f1(x1+nx*r1)} ${f1(y1+ny*r1)}L${f1(x2+nx*r2)} ${f1(y2+ny*r2)}L${f1(x2-nx*r2)} ${f1(y2-ny*r2)}L${f1(x1-nx*r1)} ${f1(y1-ny*r1)}Z"/><circle cx="${f1(x1)}" cy="${f1(y1)}" r="${f1(r1)}"/><circle cx="${f1(x2)}" cy="${f1(y2)}" r="${f1(r2)}"/></g>`; }
function heart(x,y,sz,c){ return `<path d="M${x} ${y+sz*.9}C${x-sz*1.6} ${y-sz*.2} ${x-sz*.6} ${y-sz*1.3} ${x} ${y-sz*.35}C${x+sz*.6} ${y-sz*1.3} ${x+sz*1.6} ${y-sz*.2} ${x} ${y+sz*.9}Z" fill="${c}"/>`; }
function star(x,y,r,c){ return `<path d="M${x} ${y-r}L${x+r*.28} ${y-r*.28}L${x+r} ${y}L${x+r*.28} ${y+r*.28}L${x} ${y+r}L${x-r*.28} ${y+r*.28}L${x-r} ${y}L${x-r*.28} ${y-r*.28}Z" fill="${c}"/>`; }

/* woman, front view. o: pose, skin, hair, top, bottom, stick, belly, short, bun, mood, shape{s,b,wa,h,l}, prop, def */
function frame(o){
  const sk=o.skin||SKIN[0], skD=shade(sk,-.12), hr=o.hair||'#5B3A2C', top=o.top||'#F27BA4', bot=o.bottom||'#7D5C79';
  const sh=Object.assign({s:1,b:1,wa:1,h:1,l:1},o.shape||{}), w=o.w||1, pose=o.pose||'stand';
  const S=13*w*sh.s, B=11.8*w*sh.b, Wa=8.8*w*sh.wa+(o.belly?2.8:0), H=13.4*w*sh.h, LH=6.8*w*sh.h;
  const tr=[8*w*sh.l,5*w*sh.l,3], ar=[3.5*w*sh.s,2.8*w*sh.s,2.1];
  const sit = pose==='sit';
  const oy = pose==='squat'?20 : pose==='lunge'?9 : pose==='tired'?6 : sit?38 : 0;
  const cx = 60;
  let s='', back='', fore='';
  // ground shadow
  s+=`<ellipse cx="60" cy="192" rx="${sit?34:24}" ry="3.4" fill="rgba(224,85,138,.13)"/>`;
  // sofa behind sitter
  if(sit){ s+=`<rect x="10" y="98" width="100" height="58" rx="12" fill="#E8C7D3"/><rect x="4" y="122" width="112" height="40" rx="12" fill="#F1D6E0"/><rect x="14" y="160" width="6" height="22" rx="2" fill="#C9A3B3"/><rect x="100" y="160" width="6" height="22" rx="2" fill="#C9A3B3"/>`; }
  // scene props behind
  if(o.prop==='stairs'){ s+=`<path d="M4 192V172H26V152H48V132H70V112H92V92H118V192Z" fill="#F3D9E2"/><path d="M4 172H26V152H48V132H70V112H92V92H118" fill="none" stroke="#E4BFCD" stroke-width="2"/>`; }
  // ---- legs ----
  const hipY=98+oy;
  let L, R;
  if(sit){ L=[[cx-LH,hipY],[cx-LH-4,hipY+2],[cx-LH-6,184]]; R=[[cx+LH,hipY],[cx+LH+4,hipY+2],[cx+LH+6,184]];
           L[1]=[cx-LH-2,148]; R[1]=[cx+LH+2,148]; L[2]=[cx-LH-4,184]; R[2]=[cx+LH+4,184]; }
  else if(pose==='squat'){ L=[[cx-LH,hipY],[cx-LH-15,140],[cx-LH-9,183]]; R=[[cx+LH,hipY],[cx+LH+15,140],[cx+LH+9,183]]; }
  else if(pose==='lunge'){ L=[[cx-LH,hipY],[cx-24,136],[cx-26,183]]; R=[[cx+LH,hipY],[cx+20,158],[cx+38,178]]; }
  else if(pose==='tired'){ L=[[cx-LH,hipY],[cx-LH-6,140],[cx-LH-4,183]]; R=[[cx+LH,hipY],[cx+LH+3,142],[cx+LH+2,183]]; }
  else if(pose==='hip'){ L=[[cx-LH,hipY],[cx-LH-1,141],[cx-LH-3,183]]; R=[[cx+LH,hipY],[cx+LH-3,141],[cx+LH-6,183]]; }
  else { L=[[cx-LH,hipY],[cx-LH+0.5,141],[cx-LH+1.5,183]]; R=[[cx+LH,hipY],[cx+LH-0.5,141],[cx+LH-1.5,183]]; }
  const leg=(P,c)=>seg(P[0],P[1],tr[0],tr[1],c)+seg(P[1],P[2],tr[1],tr[2],c);
  s+=leg(R,shade(bot,-.08))+leg(L,bot);
  const shoe=(P,dir)=>`<path d="M${f1(P[2][0]-6*dir*-1)} ${f1(P[2][1]+5)}Q${f1(P[2][0])} ${f1(P[2][1]-1)} ${f1(P[2][0]+7*dir)} ${f1(P[2][1]+4)}Q${f1(P[2][0]+8*dir)} ${f1(P[2][1]+7)} ${f1(P[2][0])} ${f1(P[2][1]+7)}Z" fill="#fff" stroke="#E4BFCD" stroke-width="1.2"/>`;
  s+= pose==='lunge' ? `<ellipse cx="${f1(R[2][0]+2)}" cy="${f1(R[2][1]+5)}" rx="5" ry="3" fill="#fff" stroke="#E4BFCD" stroke-width="1.2"/>`+shoe(L,-1) : shoe(L,-1)+shoe(R,1);
  // ---- torso ----
  const ty=oy, slump = pose==='slump'||pose==='tired';
  const sx = slump?1.5:0;
  const torso = `M${f1(cx-S+sx)} ${47+ty}Q${f1(cx-S-1)} ${55+ty} ${f1(cx-B)} ${63+ty}Q${f1(cx-Wa-1.5)} ${71+ty} ${f1(cx-Wa)} ${79+ty}Q${f1(cx-H-1)} ${88+ty} ${f1(cx-H)} ${99+ty}L${f1(cx+H)} ${99+ty}Q${f1(cx+H+1)} ${88+ty} ${f1(cx+Wa)} ${79+ty}Q${f1(cx+Wa+1.5)} ${71+ty} ${f1(cx+B)} ${63+ty}Q${f1(cx+S+1)} ${55+ty} ${f1(cx+S+sx)} ${47+ty}Q${cx} ${42+ty} ${f1(cx-S+sx)} ${47+ty}Z`;
  s+=`<path d="${torso}" fill="${sk}"/>`;
  // tank top
  s+=`<path d="M${f1(cx-S+4)} ${47+ty}Q${f1(cx-S)} ${55+ty} ${f1(cx-B)} ${63+ty}Q${f1(cx-Wa-1.5)} ${71+ty} ${f1(cx-Wa)} ${79+ty}L${f1(cx-Wa-.6)} ${86+ty}Q${cx} ${88.5+ty} ${f1(cx+Wa+.6)} ${86+ty}L${f1(cx+Wa)} ${79+ty}Q${f1(cx+Wa+1.5)} ${71+ty} ${f1(cx+B)} ${63+ty}Q${f1(cx+S)} ${55+ty} ${f1(cx+S-4)} ${47+ty}L${f1(cx+S-8)} ${46+ty}Q${cx} ${59+ty} ${f1(cx-S+8)} ${46+ty}Z" fill="${top}"/>`;
  s+=`<path d="M${f1(cx-B+3)} ${65+ty}Q${f1(cx-B/2)} ${69+ty} ${cx} ${65.5+ty}Q${f1(cx+B/2)} ${69+ty} ${f1(cx+B-3)} ${65+ty}" fill="none" stroke="${shade(top,-.15)}" stroke-width="1"/>`;
  if(o.belly) s+=`<ellipse cx="${cx}" cy="${83+ty}" rx="${f1(Wa+.8)}" ry="5" fill="${top}"/>`;
  // leggings top
  s+=`<path d="M${f1(cx-Wa-.8)} ${85+ty}Q${cx} ${87.5+ty} ${f1(cx+Wa+.8)} ${85+ty}Q${f1(cx+H)} ${92+ty} ${f1(cx+H)} ${99+ty}L${f1(cx+LH+tr[0])} ${104+ty}L${f1(cx-LH-tr[0])} ${104+ty}L${f1(cx-H)} ${99+ty}Q${f1(cx-H)} ${92+ty} ${f1(cx-Wa-.8)} ${85+ty}Z" fill="${bot}"/>`;
  s+=`<path d="M${f1(cx-Wa-.6)} ${86.2+ty}Q${cx} ${88.8+ty} ${f1(cx+Wa+.6)} ${86.2+ty}" fill="none" stroke="${shade(bot,.25)}" stroke-width="1.4"/>`;
  if(o.def){ s+=`<path d="M${cx} ${70+ty}V${82+ty}M${cx-4} ${74+ty}Q${cx-2} ${75+ty} ${cx-1} ${74+ty}M${cx+1} ${74+ty}Q${cx+2} ${75+ty} ${cx+4} ${74+ty}" stroke="${shade(top,-.2)}" stroke-width=".9" fill="none"/>`; }
  // ---- arms ----
  const shY=50+ty, sl=[cx-S+2+sx,shY], sr=[cx+S-2+sx,shY];
  let A1,A2, stick=null; // A = [shoulder, elbow, hand]
  const up = (dx1,y1,dx2,y2)=>[[sl,[cx-S-dx1,y1],[cx-dx2,y2]],[sr,[cx+S+dx1,y1],[cx+dx2,y2]]];
  switch(pose){
    case 'overhead': case 'squat': case 'lunge': [A1,A2]=up(7,30+oy*.55,17,9+oy*.5); stick=[[cx-46,9+oy*.5],[cx+46,9+oy*.5]]; break;
    case 'stand': [A1,A2]=[[sl,[cx-S-2,74],[cx-15,98]],[sr,[cx+S+2,74],[cx+15,98]]]; stick=[[cx-46,98],[cx+46,98]]; break;
    case 'twistL': case 'twistR': { const k=pose==='twistL'?-1:1; A1=[sl,[cx-S-1,66],[cx+k*9-10,70-k*3]]; A2=[sr,[cx+S+1,66],[cx+k*9+10,70+k*3]]; stick=[[cx+k*9-40,70-k*12],[cx+k*9+40,70+k*12]]; break; }
    case 'flex': [A1,A2]=[[sl,[cx-S-13,49],[cx-S-9,30]],[sr,[cx+S+13,49],[cx+S+9,30]]]; break;
    case 'hip': [A1,A2]=[[sl,[cx-S-11,69],[cx-Wa-3,83]],[sr,[cx+S+11,69],[cx+Wa+3,83]]]; break;
    case 'tape': [A1,A2]=[[sl,[cx-S-6,72],[cx-Wa-10,82]],[sr,[cx+S+6,72],[cx+Wa+10,82]]]; break;
    case 'joy': [A1,A2]=[[sl,[cx-S-11,33],[cx-S-22,16]],[sr,[cx+S+11,33],[cx+S+22,16]]]; break;
    case 'belly': [A1,A2]=[[sl,[cx-S-5,71],[cx-4,82+ty]],[sr,[cx+S+5,71],[cx+5,84+ty]]]; break;
    case 'chin': [A1,A2]=[[sl,[cx-S-2,76],[cx-S-3,99]],[sr,[cx+S+4,74],[cx+7,40]]]; break;
    case 'tired': [A1,A2]=[[sl,[cx-S-4,80],[cx-LH-6,112]],[sr,[cx+S+3,80],[cx+LH+4,114]]]; break;
    case 'sit': [A1,A2]=[[sl,[cx-S-3,74+ty],[cx-12,96+ty]],[sr,[cx+S+3,74+ty],[cx+12,96+ty]]]; break;
    default: [A1,A2]=[[sl,[cx-S-3,73+ty],[cx-S-3.5,97+ty]],[sr,[cx+S+3,73+ty],[cx+S+3.5,97+ty]]];
  }
  const arm=(P,c)=>seg(P[0],P[1],ar[0],ar[1],c)+seg(P[1],P[2],ar[1],ar[2],c)+`<circle cx="${f1(P[2][0])}" cy="${f1(P[2][1])}" r="${f1(ar[2]+1)}" fill="${c}"/>`;
  const armsOver = ['overhead','squat','lunge','flex','joy','chin','twistL','twistR','belly','hip','tape','stand','sit','tired'].includes(pose);
  if(stick && o.stick!==false){ const [a,b]=stick; fore+=`<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="#A8724A" stroke-width="4.2" stroke-linecap="round"/><line x1="${f1(a[0]+1)}" y1="${f1(a[1]-1)}" x2="${f1(b[0]-1)}" y2="${f1(b[1]-1)}" stroke="#D4A47A" stroke-width="1.1" stroke-linecap="round"/>`; }
  const arms = arm(A1,sk)+arm(A2,sk);
  if(o.def && pose==='flex'){ fore+=`<path d="M${f1(cx-S-12)} ${f1(46)}q-3 -4 0 -8M${f1(cx+S+12)} ${f1(46)}q3 -4 0 -8" stroke="${skD}" stroke-width="1" fill="none"/>`; }
  if(o.prop==='tape'){ fore+=`<rect x="${f1(cx-Wa-10)}" y="${80.2+ty}" width="${f1(2*Wa+20)}" height="3.6" rx="1" fill="#F6C945"/>`+Array.from({length:9},(_,i)=>`<line x1="${f1(cx-Wa-8+i*(2*Wa+16)/8)}" y1="${80.2+ty}" x2="${f1(cx-Wa-8+i*(2*Wa+16)/8)}" y2="${82+ty}" stroke="#B38A1C" stroke-width=".6"/>`).join(''); }
  // ---- head ----
  const hx = cx + (slump?2.5:0) + (pose==='chin'?1:0), hy = 25 + oy + (slump?4:0);
  // back hair
  if(o.short){ back+=`<path d="M${hx-12.5} ${hy+2}Q${hx-14} ${hy-14} ${hx} ${hy-14.5}Q${hx+14} ${hy-14} ${hx+12.5} ${hy+2}Q${hx+12} ${hy+10} ${hx+8} ${hy+11}L${hx-8} ${hy+11}Q${hx-12} ${hy+10} ${hx-12.5} ${hy+2}Z" fill="${hr}"/>`; }
  else { back+=`<path d="M${hx-12.5} ${hy}Q${hx-14} ${hy-15} ${hx} ${hy-15}Q${hx+14} ${hy-15} ${hx+12.5} ${hy}Q${hx+15} ${hy+16} ${hx+12} ${hy+24}Q${hx} ${hy+28} ${hx-12} ${hy+24}Q${hx-15} ${hy+16} ${hx-12.5} ${hy}Z" fill="${hr}"/>`; }
  if(o.bun) back+=`<circle cx="${hx+1}" cy="${hy-15}" r="6.5" fill="${hr}"/>`;
  s+=back;
  // neck
  s+=seg([hx,hy+8],[cx+sx*.5,46+ty],3.4,3.6,skD);
  // arms drawn after torso
  s+=arms+fore;
  // ---- highlight (body map) ----
  if(o.hl){
    const pk='#FF5C93'; let h='';
    const segA=(P)=>seg(P[0],P[1],ar[0]+1.2,ar[1]+1.2,pk)+seg(P[1],P[2],ar[1]+1.2,ar[2]+1.2,pk);
    const segL=(P,full)=>seg(P[0],P[1],tr[0]+1.2,tr[1]+1.2,pk)+(full?seg(P[1],P[2],tr[1]+1.2,tr[2]+1.2,pk):'');
    if(o.hl==='arms'||o.hl==='full') h+=segA(A1)+segA(A2);
    if(o.hl==='belly') h+=`<ellipse cx="${cx}" cy="${80+ty}" rx="${f1(Wa+3.5)}" ry="10" fill="${pk}"/>`;
    if(o.hl==='hips') h+=`<path d="M${f1(cx-H-1.5)} ${90+ty}Q${cx} ${84+ty} ${f1(cx+H+1.5)} ${90+ty}L${f1(cx+H+1.5)} ${102+ty}L${f1(cx-H-1.5)} ${102+ty}Z" fill="${pk}"/>`+segL(L)+segL(R);
    if(o.hl==='full') h+=`<path d="${torso}" fill="${pk}"/>`+segL(L,1)+segL(R,1);
    const id='gl'+Math.random().toString(36).slice(2,7);
    s+=`<defs><filter id="${id}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter></defs><g class="hlpulse"><g filter="url(#${id})" opacity=".55">${h}</g><g opacity=".5">${h}</g></g>`;
  }
  // face
  s+=`<ellipse cx="${hx-10}" cy="${hy+1.5}" rx="1.8" ry="2.6" fill="${skD}"/><ellipse cx="${hx+10}" cy="${hy+1.5}" rx="1.8" ry="2.6" fill="${skD}"/>`;
  s+=`<ellipse cx="${hx}" cy="${hy}" rx="10" ry="12" fill="${sk}"/>`;
  // fringe
  if(o.short) s+=`<path d="M${hx-11} ${hy}Q${hx-11} ${hy-12.5} ${hx} ${hy-13}Q${hx+11} ${hy-12.5} ${hx+11} ${hy+1}Q${hx+7} ${hy-8} ${hx-1} ${hy-8.5}Q${hx-8} ${hy-7} ${hx-11} ${hy}Z" fill="${hr}"/>`;
  else s+=`<path d="M${hx-10.8} ${hy+3}Q${hx-11.5} ${hy-12.5} ${hx+1} ${hy-12.8}Q${hx+11.5} ${hy-12} ${hx+10.8} ${hy+3}Q${hx+9} ${hy-6} ${hx+2} ${hy-8.2}Q${hx-6} ${hy-6.5} ${hx-10.8} ${hy+3}Z" fill="${hr}"/>`;
  // brows, eyes, nose, mouth
  const mood=o.mood||'smile', br=shade(hr,-.25);
  const browY = mood==='o'||mood==='worried' ? hy-3.6 : hy-3;
  s+=`<path d="M${hx-6.4} ${browY+ (mood==='worried'?1:0)}Q${hx-4.3} ${browY-1.3} ${hx-2.2} ${browY}M${hx+2.2} ${browY}Q${hx+4.3} ${browY-1.3} ${hx+6.4} ${browY+(mood==='worried'?1:0)}" stroke="${br}" stroke-width="1.1" fill="none" stroke-linecap="round"/>`;
  if(mood==='big'){ s+=`<path d="M${hx-5.6} ${hy+1}Q${hx-4.2} ${hy-.6} ${hx-2.8} ${hy+1}M${hx+2.8} ${hy+1}Q${hx+4.2} ${hy-.6} ${hx+5.6} ${hy+1}" stroke="#2B1A22" stroke-width="1.2" fill="none" stroke-linecap="round"/>`; }
  else { s+=`<ellipse cx="${hx-4.2}" cy="${hy+.6}" rx="1.25" ry="1.6" fill="#2B1A22"/><ellipse cx="${hx+4.2}" cy="${hy+.6}" rx="1.25" ry="1.6" fill="#2B1A22"/><circle cx="${hx-3.8}" cy="${hy}" r=".45" fill="#fff"/><circle cx="${hx+4.6}" cy="${hy}" r=".45" fill="#fff"/>`; }
  s+=`<path d="M${hx-.2} ${hy+2.4}Q${hx+1.3} ${hy+4.6} ${hx-.6} ${hy+5}" stroke="${shade(sk,-.28)}" stroke-width=".9" fill="none" stroke-linecap="round"/>`;
  if(mood==='big') s+=`<path d="M${hx-3.8} ${hy+6.8}Q${hx} ${hy+11.2} ${hx+3.8} ${hy+6.8}Z" fill="#B84A63"/><path d="M${hx-3.2} ${hy+7.1}Q${hx} ${hy+8.2} ${hx+3.2} ${hy+7.1}L${hx+2.8} ${hy+7.9}Q${hx} ${hy+8.8} ${hx-2.8} ${hy+7.9}Z" fill="#fff"/>`;
  else if(mood==='flat') s+=`<path d="M${hx-3} ${hy+8}Q${hx} ${hy+7.4} ${hx+3} ${hy+8}" stroke="#B84A63" stroke-width="1.4" fill="none" stroke-linecap="round"/>`;
  else if(mood==='o'||mood==='worried') s+=`<ellipse cx="${hx}" cy="${hy+8}" rx="1.7" ry="2" fill="#B84A63"/>`;
  else s+=`<path d="M${hx-3.4} ${hy+7}Q${hx} ${hy+10} ${hx+3.4} ${hy+7}Q${hx} ${hy+8.4} ${hx-3.4} ${hy+7}Z" fill="#C9566F"/>`;

function next(){ hist.push(idx); idx++; while(S[idx] && S[idx].skipIf && S[idx].skipIf()) idx++; render(); }
function back(){ if(!hist.length) return; idx=hist.pop(); render(); }
$('#back').onclick=back;
function advanceAfter(msg, ms=900){ if(msg) toast(msg, ms+300); setTimeout(next, msg?ms:350); }

function renderChrome(sc){
  const isCover = sc.type==='cover', isOffer = sc.type==='offer';
  $('#hdr').hidden = isCover;
  $('#plan').hidden = isCover || isOffer || ['scorereveal','future','calendar','scratch'].includes(sc.type);
  $('#back').style.visibility = (isCover||!hist.length)?'hidden':'visible';
  const phIdx = sc.phase;
  const inPhase = S.filter(s=>s.phase===phIdx), pos = inPhase.indexOf(sc);
  $('#phases').innerHTML = PHASES.map((n,i)=>{
    const w = i<phIdx?100: i>phIdx?0: Math.round((pos+1)/inPhase.length*100);
    return `<div class="ph ${i===phIdx?'on':''}"><div class="ph-bar"><i style="width:${w}%"></i></div><div class="ph-lbl">${n}</div></div>`;
  }).join('');
  renderPlan(); renderScore();
}

function render(){
  const sc=S[idx]; if(!sc) return;
  window.scrollTo(0,0);
  renderChrome(sc);
  track('quiz_step',{step:idx+1,screen:sc.id});
  const fn = R[sc.type]; main.innerHTML=''; cta(null); fn(sc);
}

function swipeable(el,cb){
  let x0=null,dx=0;
  el.addEventListener('pointerdown',e=>{x0=e.clientX;el.style.transition='none';el.setPointerCapture(e.pointerId);});
  el.addEventListener('pointermove',e=>{ if(x0===null) return; dx=e.clientX-x0; el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
    el.querySelector('.stamp.y').style.opacity=Math.max(0,dx/90); el.querySelector('.stamp.n').style.opacity=Math.max(0,-dx/90); });
  const end=()=>{ if(x0===null) return; el.style.transition=''; x0=null;
    if(dx>80) cb('yes'); else if(dx<-80) cb('no'); else { el.style.transform=''; el.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0); } dx=0; };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
}

function blockers(){
  const h={regular:10,unsure:22,peri:36,meno:40,post:32}[A.hormone]||20;
  const sl=(A.sleep||[]).filter(x=>x!=='fine');
  const sleep=6+sl.length*12+(sl.includes('hot')?8:0);
  const hab=(A.habits||[]).filter(x=>x!=='none').length;
  const stress=8+({1:14,2:10,3:6,4:2,5:0}[A.energy]||6)+hab*5;
  const tr=(A.tried||[]).filter(x=>x!=='nothing').length;
  const aon=6+tr*6+(['hard','regain','bored'].includes(A.obstacle)?10:0)+((A.statements||{}).quit==='yes'?8:0);
  const raw=[['Hormone shift',h,'hormone'],['Poor sleep',sleep,'sleep'],['Stress & cortisol',stress,'stress'],['All-or-nothing workouts',aon,'aon']];
  const tot=raw.reduce((a,b)=>a+b[1],0);
  let out=raw.map(([n,v,k])=>[n,Math.round(v/tot*100),k]).sort((a,b)=>b[1]-a[1]);
  const diff=100-out.reduce((a,b)=>a+b[1],0); out[0][1]+=diff; return out;
}

      <div class="col" style="border:2px solid var(--pink)"><div class="art">${anim({pose:'overhead'},{pose:'squat'},W)}</div><h4 class="hl">Day 28</h4>${rows.map(r=>`<div class="mlbl">${r[0]}</div>${m(r[0],r[2])}`).join('')}</div>
    </div>
    <div class="tip">🎯 Your goal: <b>${{belly:'a flatter, firmer belly',arms:'toned, strong arms',hips:'firmer hips and thighs',full:'a stronger, firmer body'}[A.zone]||'a stronger body'}</b>, more energy and clothes that fit the way you like. One habit at a time.</div>
    <p class="small">Illustration only. Results vary from person to person.</p></div>`;
  cta('Continue', true, next);
};

R.calendar = sc => {
  let cells=''; for(let d=1;d<=28;d++) cells+=`<div class="${d===1?'d1':''}" ${d===1?'id="d1"':''}>${d===1?'1':d}</div>`;
  main.innerHTML = `<div class="scr"><h2>Your 28 days are mapped out 📅</h2><p class="sub">Day 1 is ready. <b>Tap it</b> to see what's inside.</p>
    <div class="week-lbl"><span>Wk 1 · Wake up</span><span>Wk 2 · Firm up</span><span>Wk 3 · Sculpt</span><span>Wk 4 · Lock it in</span></div>
    <div class="cal">${cells}</div>
    <div class="tip">🔥 Do Day 1 today and start your streak.</div></div>`;
  const open=()=>{
    const mv=(A.moves&&A.moves.length?A.moves:['reach','squat','twist']).slice(0,4);
    const d=document.createElement('div'); d.className='modal';
    d.innerHTML=`<div class="sheet"><h2 style="margin-top:0">Day 1 · ${A.time||15} minutes</h2><p class="sub" style="margin:0">${plan.joints||'Gentle'} · ${plan.intensity||'Gentle'} · ${plan.place||'Living room'}</p>
      <div class="moves-list">${mv.map(k=>`<div>🧹 ${MOVES[k].name} <span style="margin-left:auto;color:var(--muted);font-size:13px">3 rounds</span></div>`).join('')}<div>🌙 5-min evening wind-down</div></div>
      <button class="cta" id="cl">Unlock my plan →</button></div>`;
    document.body.appendChild(d); d.onclick=e=>{ if(e.target===d) d.remove(); }; $('#cl').onclick=()=>{ d.remove(); next(); };
    track('day1_preview');
  };
  $('#d1').onclick=open;
  cta('Continue', true, next);
};

R.scratch = sc => {
  main.innerHTML = `<div class="scr" style="text-align:center"><h2>${esc(nameOr('Hey'))}, one more thing...</h2><p class="sub">Scratch the card to reveal your bonus 🎁</p>
    <div class="scratch"><div class="prize"><b>Knee & Back Friendly Version</b><span>FREE with your plan today</span></div><canvas id="sc" width="300" height="190"></canvas></div>
    <p class="small" id="sh">Use your finger.</p></div>`;
  const cv=$('#sc'), ctx=cv.getContext('2d');
  const g=ctx.createLinearGradient(0,0,300,190); g.addColorStop(0,'#F27BA4'); g.addColorStop(1,'#E0558A');
  ctx.fillStyle=g; ctx.fillRect(0,0,300,190);
  ctx.fillStyle='rgba(255,255,255,.9)'; ctx.font='900 22px Nunito, sans-serif'; ctx.textAlign='center'; ctx.fillText('SCRATCH HERE',150,92); ctx.font='800 14px Nunito, sans-serif'; ctx.fillText('🎁 your bonus is hiding',150,118);
  ctx.globalCompositeOperation='destination-out';
  let down=false, revealed=false;
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*300/r.width,(e.clientY-r.top)*190/r.height]; };
  const draw=e=>{ const [x,y]=pos(e); ctx.beginPath(); ctx.arc(x,y,22,0,Math.PI*2); ctx.fill(); };
  const check=()=>{ if(revealed) return; const d=ctx.getImageData(0,0,300,190).data; let c=0; for(let i=3;i<d.length;i+=16) if(d[i]===0) c++; if(c/(d.length/16)>.45) reveal(); };
  const reveal=()=>{ revealed=true; cv.style.transition='opacity .4s'; cv.style.opacity=0; confetti(); $('#sh').textContent='🎉 Unlocked! It’s added to your plan.'; A.bonus=true; track('scratch_done'); cta('Claim my plan + bonus →', true, next, true); };
  cv.addEventListener('pointerdown',e=>{down=true;cv.setPointerCapture(e.pointerId);draw(e);});
  cv.addEventListener('pointermove',e=>{ if(down){draw(e);} });
  cv.addEventListener('pointerup',()=>{down=false;check();});
  cta('Reveal it for me', true, reveal);
};

  main.innerHTML = `<div class="scr offer">

    ${priceBox(1)}
    <div class="box guar"><div class="seal">28-DAY<br>PROMISE</div><div><b>Try it, risk-free.</b><p style="margin:4px 0 0;font-size:14px;color:var(--muted)">Do the 28 days. If you don't love how you feel, email us within 30 days and we'll refund every cent. No questions, no hoops.</p></div></div>
    <div class="box"><h3 style="margin:0 0 10px">Why this works when diets didn't</h3><div class="vs">
      <div class="c bad"><b>What you tried</b><ul><li>Strict diets</li><li>Giving up foods you love</li><li>Workouts too hard to keep</li><li>Gaining it back</li></ul></div>
      <div class="c good"><b>Stick Challenge ⚡</b><ul><li>15 minutes a day</li><li>Gentle on joints</li><li>Built for hormones after 40</li><li>A habit you keep</li></ul></div></div></div>
    <div class="box" style="text-align:center"><div style="font-size:15px;font-weight:900;margin-bottom:8px">How the 3G Method works</div>
      <div style="display:flex;gap:8px;text-align:center;font-size:13px">
      <div style="flex:1;background:#FFF0F5;border-radius:12px;padding:10px"><b class="hl">GRIP</b><br>Squeeze the stick, arms and core stay on</div>
      <div style="flex:1;background:#FFF0F5;border-radius:12px;padding:10px"><b class="hl">GUIDE</b><br>The stick keeps you aligned and safe</div>
      <div style="flex:1;background:#FFF0F5;border-radius:12px;padding:10px"><b class="hl">GLIDE</b><br>Slow, low-impact, no jumping</div></div></div>
    <div class="faq"><h3>Questions</h3>

  </div>`;
  main.querySelectorAll('[data-ck]').forEach(a=>a.onclick=()=>track('InitiateCheckout',{value:CONFIG.PRICE,currency:'USD'}));
  track('ViewContent',{value:CONFIG.PRICE,currency:'USD'});
  cta('UNLOCK MY PLAN · $'+CONFIG.PRICE, true, ()=>{ track('InitiateCheckout',{value:CONFIG.PRICE,currency:'USD'}); location.href=url; });
};

render();
</script>
